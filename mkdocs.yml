site_name: Wiki Mosqueteroweb
site_description: Recopilatorio personal de notas, salud, utilidades y curiosidades
site_url: https://mosqueteroweb.github.io/Salud/
site_dir: _site
theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: es
  - awesome-pages
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - markdown.extensions.md_in_html
  - attr_list
